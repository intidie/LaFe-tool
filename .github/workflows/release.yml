# Compila LaFe Tool para Windows y publica el instalador en Releases.
# Descarga directa fija: https://github.com/intidie/LaFe-tool/releases/latest/download/LaFe-Tool-Setup.exe
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias del frontend
        run: npm ci

      - name: Recursos (motor, FFmpeg, ExifTool)
        shell: pwsh
        run: ./scripts/prepare-resources.ps1 -Python python

      - name: Compilar instalador (Tauri + NSIS)
        run: npx tauri build --bundles nsis

      - name: Preparar artefacto
        id: art
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName out/LaFe-Tool-Setup.exe
          "version=$version" >> $env:GITHUB_OUTPUT
          "LaFe-Tool-Setup.exe: $([math]::Round((Get-Item out/LaFe-Tool-Setup.exe).Length / 1MB, 1)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: LaFe-Tool-Setup
          path: out/LaFe-Tool-Setup.exe

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.art.outputs.version }}
          name: LaFe Tool v${{ steps.art.outputs.version }}
          make_latest: "true"
          body: |
            ## Descargar
            **[LaFe-Tool-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/LaFe-Tool-Setup.exe)** — ábrelo y sigue el asistente.
            Se instala para tu usuario (sin permisos de administrador) y crea el acceso directo **LaFe Tool** en el Escritorio y en el menú Inicio.

            Incluye todo lo necesario: motor de render, FFmpeg y ExifTool (ExifCleaner). No hace falta instalar Python ni Node.js.
            Si Windows muestra SmartScreen: *Más información → Ejecutar de todos modos* (el instalador no está firmado).

            Compilado desde ${{ github.sha }}.
          files: out/LaFe-Tool-Setup.exe
