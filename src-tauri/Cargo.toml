[package]
name = "lafe-tool"
version = "1.1.0"
description = "LaFe Tool: subtítulos estilo cartel, lip-sync y limpieza de metadatos"
authors = ["intidie"]
edition = "2021"
license = "MIT"

[lib]
name = "lafe_tool_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ttf-parser = "0.25"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
